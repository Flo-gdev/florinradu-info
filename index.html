<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florin Radu Photography</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo-container">
        <img
                src="images/logo.png"
                alt="Florin Radu Photography"
                class="logo">
    </div>

    <nav class="links">
        <a
                href="https://instagram.com/florin_radu_photography"
                target="_blank"
                rel="noopener noreferrer">
            Instagram
        </a>
    </nav>

</header>

<main class="content">

    <div
            id="landscape"
            class="photo-frame landscape-frame">
    </div>

    <div
            id="portrait"
            class="photo-frame portrait-frame">
    </div>

</main>

<footer class="footer">

    <a
            href="https://wa.me/32489948010"
            target="_blank"
            rel="noopener noreferrer">
        WhatsApp
    </a>

    <a
            href="mailto:florin6radu@gmail.com">
        Email
    </a>

</footer>

<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">

    <span id="close-btn">&times;</span>

    <button id="prev-btn">&#10094;</button>

    <img id="lightbox-image" src="" alt="Photo">

    <button id="next-btn">&#10095;</button>

</div>

<script src="js/app.js"></script>

</body>

</html>
